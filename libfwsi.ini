[project]
description: "libfwsi is a library to access the Windows Shell Item format."
name: "libfwsi"
status: "experimental"
year_of_creation: "2010"
documentation_url: "https://github.com/libyal/libfwsi/tree/main/documentation"
features: ["debug_output", "ossfuzz", "python_bindings"]

[library]
description: "Library to access the Windows Shell Item format"
public_types: ["extension_block", "item", "item_list"]
tests: ["cdburn_values", "compressed_folder_values", "control_panel_category_values", "control_panel_cpl_file_values", "control_panel_item_values", "delegate_folder_values", "error", "extension_block", "extension_block_0xbeef0000_values", "extension_block_0xbeef0001_values", "extension_block_0xbeef0003_values", "extension_block_0xbeef0005_values", "extension_block_0xbeef0006_values", "extension_block_0xbeef000a_values", "extension_block_0xbeef0013_values", "extension_block_0xbeef0014_values", "extension_block_0xbeef0019_values", "extension_block_0xbeef0025_values", "file_entry_extension_values", "file_entry_values", "game_folder_values", "item", "item_list", "mtp_file_entry_values", "mtp_volume_values", "network_location_values", "notify", "root_folder_values", "support", "uri_values", "uri_sub_values", "users_property_view_values", "volume_values"]

[python_module]
tests: ["support"]

[tests]
